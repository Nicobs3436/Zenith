[project]
name = "gym-routines-api"
version = "0.1.0"
description = "Backend API for gym routine management and AI-assisted progression."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.0,<2.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "pwdlib[argon2]>=0.2.1,<1.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W: estilo pycodestyle, F: errores (pyflakes), I: orden de imports, B: bugs comunes, UP: sintaxis moderna.
select = ["E", "W", "F", "I", "B", "UP"]
# E501: los prompts de IA son cadenas largas a proposito; el formateador ya controla el resto.
# B008: Depends()/Query() en parametros por defecto es el patron oficial de FastAPI.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Los fixtures de pytest importados se "redefinen" como parametros de los tests.
"tests/*" = ["F811"]
